<h2 mat-dialog-title>
  Do you want remove the Item ?
  <button mat-icon-button (click)="onCancel()" class="close-button" aria-label="Close">
      <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="dialog-content">

  <mat-card class="menu-item">
    <!-- <img mat-card-image [src]="item.imagePath" alt="{{ item.item }}" /> -->
    <!-- Image card component with a fixed size -->
    <img mat-card-image [src]="localImagePath" alt="{{ data.item }}"
      style="width: 300px; height: 300px; object-fit: cover;" />

    <mat-card-content>

      <p><strong>Menu Id :</strong> {{ data.id }}</p>
      <p><strong>Quantity :</strong> {{ data.quantity !== null ? data.quantity : 'N/A' }}</p>
      <p><strong>Price :</strong> {{ data.price | currency:'INR':'symbol':'1.0-2' }}</p>
      <p><strong>Description :</strong> {{ data.description }}</p>

    </mat-card-content>

  </mat-card>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="warn" (click)="onRemove()" aria-label="Remove item">Remove</button>
  <button mat-raised-button (click)="onCancel()" aria-label="Cancel">Cancel</button>
</mat-dialog-actions>
