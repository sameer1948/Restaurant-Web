<h2 mat-dialog-title>
  {{title}}
  <button mat-icon-button (click)="onClose()" class="close-button" aria-label="Close">
      <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="dialog-content">
  <div class="message">
      <mat-icon>error</mat-icon>
      <h2 [innerHTML]="message"></h2>
  </div>

  <div class="actions">
    <button mat-raised-button color="warn" type="button" (click)="onClose()">Close</button>
  </div>
</mat-dialog-content>
