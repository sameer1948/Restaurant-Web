<mat-card appearance="outlined">

    <mat-card-header>
        <mat-card-title>
            <mat-icon>contacts</mat-icon> About Us
        </mat-card-title>
    </mat-card-header>

    <mat-card-content>

        <h2>About Us</h2>
        <p>Welcome to our application. We aim to provide the best services to our users.</p>

        <h2>Contact Us</h2>

        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">

            <mat-form-field appearance="fill">
                <mat-icon matPrefix>person</mat-icon><mat-label>Name</mat-label>
                <input matInput formControlName="name" required>
                <mat-error *ngIf="name?.invalid && name?.touched">
                    Name is required.
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-icon matPrefix>alternate_email</mat-icon><mat-label>Email</mat-label>
                <input matInput formControlName="email" required>
                <mat-error *ngIf="email?.invalid && email?.touched">
                    Please enter a valid email.
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-icon matPrefix>comment</mat-icon> <mat-label>Message</mat-label>
                <textarea matInput formControlName="message" required></textarea>
                <mat-error *ngIf="message?.invalid && message?.touched">
                    Message is required.
                </mat-error>
            </mat-form-field>

            <button mat-raised-button color="primary" type="submit" [disabled]="contactForm.invalid"><mat-icon>send</mat-icon>Send</button>

        </form>

    </mat-card-content>

</mat-card>
