<h2 mat-dialog-title>
  Change Password
  <button mat-icon-button (click)="onClose()" class="close-button" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">

    <!-- Old Password -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Old Password</mat-label>
      <input matInput 
             [type]="showOldPassword ? 'text' : 'password'" 
             formControlName="oldPassword" 
             required 
             (input)="onOldPasswordChange()" />
      <button mat-icon-button matSuffix (click)="toggleOldPasswordVisibility()">
        <mat-icon>{{ showOldPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('incorrect')">
        The old password you entered is incorrect.
      </mat-error>
      <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('required')">
        Old password is required
      </mat-error>
    </mat-form-field>

    <!-- New Password -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>New Password</mat-label>
      <input matInput 
             [type]="showNewPassword ? 'text' : 'password'" 
             formControlName="newPassword" 
             required />
      <button mat-icon-button matSuffix (click)="toggleNewPasswordVisibility()">
        <mat-icon>{{ showNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">
        New password is required
      </mat-error>
    </mat-form-field>

    <!-- Confirm New Password -->
    <mat-form-field appearance="fill" class="form-field">
      <mat-label>Confirm New Password</mat-label>
      <input matInput 
             [type]="showConfirmPassword ? 'text' : 'password'" 
             formControlName="confirmPassword" 
             required />
      <button mat-icon-button matSuffix (click)="toggleConfirmPasswordVisibility()">
        <mat-icon>{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
        Please confirm the new password
      </mat-error>
      <mat-error *ngIf="passwordForm.hasError('passwordMismatch')">
        New password and confirmation must match
      </mat-error>
    </mat-form-field>

    <!-- Actions -->
    <div class="dialog-actions">
      <button mat-button (click)="onClose()">Cancel</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="passwordForm.invalid">Change Password</button>
    </div>
  </form>
</mat-dialog-content>
