<h2 mat-dialog-title class="dialog-title">
    Add New Tax And Fee
    <button mat-icon-button (click)="onClose()" class="close-button" aria-label="Close">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<mat-dialog-content>

    <form [formGroup]="taxAndDetailsForm">

        <mat-grid-list cols="2" rowHeight="100px">

            <mat-grid-tile>
                <mat-form-field appearance="fill">
                    <mat-label>Tax And Fee Type</mat-label>

                    <input matInput formControlName="taxType" />

                    <mat-error
                        *ngIf="taxAndDetailsForm.get('taxType')?.hasError('required') && taxAndDetailsForm.get('taxType')?.touched">
                        Coupon code is required.
                    </mat-error>

                    <mat-error
                        *ngIf="taxAndDetailsForm.get('taxType')?.hasError('minlength') && taxAndDetailsForm.get('taxType')?.touched">
                        Coupon code must be at least 4 characters.
                    </mat-error>

                </mat-form-field>
            </mat-grid-tile>

            <mat-grid-tile>
                <mat-form-field appearance="fill">
                    <mat-label>Percentage</mat-label>
                    <input matInput type="number" formControlName="value" />
                    <mat-error *ngIf="taxAndDetailsForm.get('value')?.hasError('required')">Percentage is
                        required.</mat-error>
                </mat-form-field>
            </mat-grid-tile>

            <mat-grid-tile>
                <mat-form-field appearance="fill">
                    <mat-label>Status</mat-label>
                    <mat-select formControlName="status" (selectionChange)="updateStatus($event.value)">
                        <mat-option [value]="'Enabled'">Enabled</mat-option>
                        <mat-option [value]="'Disabled'">Disabled</mat-option>
                    </mat-select>
                    <mat-error
                        *ngIf="taxAndDetailsForm.get('status')?.hasError('required') && taxAndDetailsForm.get('status')?.touched">
                        Status is required.
                    </mat-error>
                </mat-form-field>
            </mat-grid-tile>

            <mat-grid-tile>
                <mat-form-field appearance="fill">
                    <mat-label>Added By</mat-label>
                    <input matInput type="text" formControlName="memberName" readonly="true" />
                </mat-form-field>
            </mat-grid-tile>

            <mat-grid-tile colspan="2">
                <mat-form-field appearance="fill" style="width: 95%;">
                    <mat-label>Added By</mat-label>
                    <input matInput type="text" formControlName="message" readonly="true" />
                </mat-form-field>
            </mat-grid-tile>

        </mat-grid-list>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-button [disabled]="taxAndDetailsForm.invalid" (click)="onSubmit()">Add</button>
</mat-dialog-actions>
