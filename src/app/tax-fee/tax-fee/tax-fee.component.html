<mat-card class="taxAndFee-container" appearance="outlined">

    <mat-card-header class="taxAndFee-header">
        <mat-card-title> <mat-icon>view_comfy_alt</mat-icon> Tax And Fee </mat-card-title>
    </mat-card-header>

    <mat-card-content>

        <mat-card class="data-section" appearance="outlined">

            <mat-card-content>

                <h2>Tax and Fee Services</h2>

                <mat-grid-list cols="3" rowHeight="100px">

                    <mat-grid-tile>
                        <button mat-raised-button color="primary" (click)="addTaxAndFeeDialog()">Add TaxAndFee </button>
                    </mat-grid-tile>

                    <!-- Search Bar -->
                    <mat-grid-tile>

                        <mat-form-field appearance="fill" style="width: 100%;">

                            <mat-icon matPrefix>search</mat-icon>
                            <mat-label>Search Tax </mat-label>

                            <input matInput [(ngModel)]="searchQuery" (input)="applyFilter()" />

                            <button mat-icon-button *ngIf="searchQuery" matSuffix (click)="clearSearch()">
                                <mat-icon>clear</mat-icon>
                            </button>

                        </mat-form-field>

                    </mat-grid-tile>

                </mat-grid-list>

                <div class="loading-container mat-elevation-z8">
                    @if (isLoading ) {
                    <div class="loading-shade">
                        @if (isLoading) {
                        <mat-spinner></mat-spinner>
                        }
        
                    </div>
                    }
                </div>

                <mat-card appearance="outlined">

                    <mat-card-content class="taxAndFee-table-continer">

                        <mat-table [dataSource]="dataSource" matSort>

                            <ng-container matColumnDef="taxId">
                                <mat-header-cell *matHeaderCellDef mat-sort-header> Tax Id </mat-header-cell>
                                <mat-cell *matCellDef="let element"> {{element.tax.taxId}} </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="taxType">
                                <mat-header-cell *matHeaderCellDef mat-sort-header> Tax Type </mat-header-cell>
                                <mat-cell *matCellDef="let element"> {{element.tax.taxType}} </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="value">
                                <mat-header-cell *matHeaderCellDef mat-sort-header> Percentage </mat-header-cell>
                                <mat-cell *matCellDef="let element"> {{element.tax.value}} %</mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="status">
                                <mat-header-cell *matHeaderCellDef mat-sort-header> Status </mat-header-cell>
                                <mat-cell *matCellDef="let element"
                                    [ngClass]="{'active-status': element.tax.status, 'expired-status': !element.tax.status}">
                                    {{ element.tax.status ? 'Enabled' : 'Disabled' }}
                                </mat-cell>
                            </ng-container>
                            
                            <ng-container matColumnDef="actions">
                                <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>

                                <mat-cell *matCellDef="let element">

                                    <button color="primary" mat-icon-button matTooltip="Open Tax And Fee"
                                        (click)="viewTaxAndFeeDialog(element)">
                                        <mat-icon>open_in_new</mat-icon>
                                    </button>

                                    <button color="accent" mat-icon-button matTooltip="Edit Tax And Fee"
                                        (click)="updateTaxAndFeeDialog(element)">
                                        <mat-icon>create</mat-icon>
                                    </button>

                                    <button color="warn" mat-icon-button matTooltip="Delete Tax and Fee"
                                        (click)="deleteTaxAndFeeDialog(element)">
                                        <mat-icon>delete</mat-icon>
                                    </button>

                                </mat-cell>
                            </ng-container>

                            <ng-container matColumnDef="noData">
                                <mat-footer-cell *matFooterCellDef>
                                    <!-- Error message container -->
                                    <div *ngIf="isError" class="error-container">
                                        <mat-icon color="warn">error</mat-icon>
                                        <span>{{ errorMessage }}</span>
                                    </div>
                                </mat-footer-cell>
                            </ng-container>
                
                            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
                
                            <mat-footer-row *matFooterRowDef="['noData']"
                                [ngClass]="{'hide':!(dataSource!=null && dataSource.data.length==0)}">
                            </mat-footer-row>
                        </mat-table>

                        <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="pageSizes"></mat-paginator>

                    </mat-card-content>

                </mat-card>
            </mat-card-content>
        </mat-card>

    </mat-card-content>

</mat-card>
